name: Test and release

on:
  push:
    branches: [dev]
    tags: ['v*', '!v*-beta*', '!v*-alpha*']
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y lua5.4 rsync zip jq
      - name: Checkout the pinned official packager for integration tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: BigWigsMods/packager
          ref: 01e8631a69c69d7654c788d152630d5fed9e3812
          path: .packager
          persist-credentials: false
      - name: Generate runtime patchnotes
        run: python3 scripts/generate-patchnotes.py
      - name: Check syntax and regression tests
        env:
          SAM_TEST_PACKAGER: ${{ github.workspace }}/.packager/release.sh
        run: |
          find . -maxdepth 1 -name '*.lua' -exec luac5.4 -p {} +
          find data traductions patchnote -name '*.lua' -exec luac5.4 -p {} +
          for test in scripts/test-*.lua; do lua5.4 "$test"; done
          for test in scripts/test-*.py; do python3 "$test"; done
          bash -n scripts/install-local.sh scripts/package.sh scripts/ci-packager.sh
          git diff --check

  package:
    needs: checks
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y zip jq
      - name: Checkout the pinned official packager
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: BigWigsMods/packager
          ref: 01e8631a69c69d7654c788d152630d5fed9e3812
          path: .packager
          persist-credentials: false
      - name: Prepare the validated beta or stable version
        id: release
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 scripts/prepare-ci-release.py \
            --ref "$SOURCE_REF" --sha "$SOURCE_SHA" \
            --run-number "$BUILD_NUMBER" --attempt "$BUILD_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"
      - name: Build and verify the upload ZIP
        run: bash scripts/ci-packager.sh build
      - name: Save ZIP and Markdown together
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SkillsAndMore-${{ steps.release.outputs.version }}
          path: |
            release/latest/*.zip
            release/latest/patchnote.md
          if-no-files-found: error
          retention-days: 30
      - name: Check whether publishing is enabled
        id: publish
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CF_API_KEY }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [[ "$TRIGGER" == push && -n "$CF_API_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo '::warning::Build-only run: add CF_API_TOKEN to enable automatic publishing. Manual runs never upload.'
          fi
      - name: Publish beta tag
        if: steps.publish.outputs.enabled == 'true' && steps.release.outputs.channel == 'beta'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: git push origin "refs/tags/$RELEASE_TAG"
      - name: Upload the same ZIP and notes to CurseForge and GitHub
        if: steps.publish.outputs.enabled == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CF_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-packager.sh publish
      - name: Attach the copy-ready Markdown to the GitHub release
        if: steps.publish.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/latest/patchnote.md
      - name: Report the build result
        env:
          BUILD_VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          PUBLISHED: ${{ steps.publish.outputs.enabled }}
        run: |
          printf 'Version: **%s**\n\nChannel: **%s**\n\nPublishing enabled: **%s**\n\nZIP and patchnote.md are attached as workflow artifacts.\n' \
            "$BUILD_VERSION" "$CHANNEL" "$PUBLISHED" >> "$GITHUB_STEP_SUMMARY"
